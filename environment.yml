name: qacldn
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - matplotlib>=3.7
  - jupyter>=1.0
  - jupytext>=1.15
  - nbformat>=5.9
  - nbconvert>=7.10
  - ipykernel>=6.25
  - jupyter_client>=8.3
  - pytest>=7.4
  - pip
  - pip:
      - pdf2image>=1.17   # optional, only for regenerating manuscript PDF previews
